<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1e3c72">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>🏏 Cricket DRS - Sender</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            height: var(--app-height, 100dvh);
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            -webkit-text-size-adjust: 100%;
        }

        body {
            display: flex;
            position: fixed;
            inset: 0;
        }

        .card {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.96);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: calc(6px + env(safe-area-inset-top)) 6px calc(6px + env(safe-area-inset-bottom));
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 0 0 auto;
            height: 36px;
            margin-bottom: 6px;
        }

        .top-bar-label {
            font-size: 14px;
            font-weight: 700;
            color: #1e3c72;
        }

        .toggle-switch {
            position: relative;
            width: 48px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #cfd8dc;
            transition: 0.2s;
            border-radius: 999px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.2s;
            border-radius: 50%;
        }

        .toggle-switch input:checked + .toggle-slider {
            background-color: #4caf50;
        }

        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(22px);
        }

        .status-light {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #4caf50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .status-light.disconnected {
            background: #f44336;
            box-shadow: 0 0 8px rgba(244, 67, 54, 0.9);
        }

        .section {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .event-grid {
            flex: 1 1 auto;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-rows: repeat(9, minmax(0, 1fr));
            gap: 4px;
            overflow: hidden;
        }

        .event-grid button {
            width: 100%;
            height: 100%;
            min-height: 0;
            padding: 2px 3px;
            border: none;
            border-radius: 6px;
            background: #1e3c72;
            color: #fff;
            font-weight: 700;
            font-size: clamp(11px, 2.6vw + 0.55vh, 18px);
            line-height: 1.1;
            white-space: normal;
            overflow: hidden;
            overflow-wrap: anywhere;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .event-grid button:active {
            background: #4caf50;
        }

        .event-grid button:disabled {
            pointer-events: none;
        }

        @media (min-width: 700px) {
            .event-grid {
                grid-template-columns: repeat(5, minmax(0, 1fr));
                grid-template-rows: repeat(7, minmax(0, 1fr));
                gap: 6px;
            }

            .event-grid button {
                font-size: clamp(14px, 1.4vw + 0.6vh, 22px);
                border-radius: 8px;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .top-bar { height: 28px; margin-bottom: 4px; }
            .event-grid {
                grid-template-columns: repeat(7, minmax(0, 1fr));
                grid-template-rows: repeat(5, minmax(0, 1fr));
                gap: 3px;
            }
            .event-grid button { font-size: clamp(10px, 1.8vw + 0.8vh, 16px); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="top-bar">
            <span class="top-bar-label">Sender</span>
            <label class="toggle-switch" aria-label="Toggle sender on or off">
                <input type="checkbox" id="senderToggle" checked>
                <span class="toggle-slider"></span>
            </label>
            <div class="status-light" id="statusLight"></div>
        </div>
        <!-- EVENTS -->
        <div class="section" id="events-panel">
            <div class="event-grid">
                <button onclick="sendEvent('WICKET')">Wicket</button>
                <button onclick="sendEvent('BALL')">Ball</button>
                <button onclick="sendEvent('0')">0</button>
                <button onclick="sendEvent('1')">1</button>
                <button onclick="sendEvent('CAUGHT OUT')">Caught</button>
                <button onclick="sendEvent('BOWLED')">Bowled</button>
                <button onclick="sendEvent('2')">2</button>
                <button onclick="sendEvent('4')">4</button>
                <button onclick="sendEvent('RUN OUT')">Run Out</button>
                <button onclick="sendEvent('LBW OUT')">LBW</button>
                <button onclick="sendEvent('3')">3</button>
                <button onclick="sendEvent('6')">6</button>
                <button onclick="sendEvent('BALL STOP')">Ball Stop</button>
                <button onclick="sendEvent('NO BALL')">No Ball</button>
                <button onclick="sendEvent('WIDE')">Wide</button>
                <button onclick="sendEvent('FREE HIT')">Free Hit</button>
                <button onclick="sendEvent('HAWA MAI')">Hawa Mai</button>
                <button onclick="sendEvent('APPEAL')">Appeal</button>
                <button onclick="sendEvent('HIT WICKET')">Hit Wicket</button>
                <button onclick="sendEvent('STUMPED OUT')">Stumped</button>
                <button onclick="sendEvent('NOT OUT')">Not Out</button>
                <button onclick="sendEvent('DRINK')">Drink</button>
                <button onclick="sendEvent('SPINNER')">Spinner</button>
                <button onclick="sendEvent('FASTER')">Faster</button>
                <button onclick="sendEvent('BREAK')">Break</button>
                <button onclick="sendEvent('CATCH DROP')">Catch Drop</button>
                <button onclick="sendEvent('REVIEW')">Review</button>
                <button onclick="sendEvent('WIDE+1')">Wide+1</button>
                <button onclick="sendEvent('WIDE+2')">Wide+2</button>
                <button onclick="sendEvent('WIDE+4')">Wide+4</button>
                <button onclick="sendEvent('NO BALL+1')">NB+1</button>
                <button onclick="sendEvent('NO BALL+2')">NB+2</button>
                <button onclick="sendEvent('NO BALL+4')">NB+4</button>
                <button onclick="sendEvent('NO BALL+6')">NB+6</button>
            </div>
        </div>
    </div>

    <script>
        let socket;
        let liveSocket;
        let sendingEnabled = true;
        const LIVE_API_URL = 'https://api.cricketking.live';

        function fitScreen() {
            document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
        }

        window.onload = function() {
            fitScreen();
            window.addEventListener('resize', fitScreen);
            createSocket();
            createLiveSocket();
            initToggle();
        };

        function initToggle() {
            const toggle = document.getElementById('senderToggle');
            if(!toggle) return;

            sendingEnabled = toggle.checked;
            setButtonsEnabled(sendingEnabled);
            emitSenderStatus(sendingEnabled);

            toggle.addEventListener('change', () => {
                sendingEnabled = toggle.checked;
                setButtonsEnabled(sendingEnabled);
                emitSenderStatus(sendingEnabled);
            });
        }

        function emitSenderStatus(enabled) {
            if(socket && socket.connected) {
                socket.emit('sender_status', { enabled: !!enabled });
            }

            if(enabled && liveSocket && liveSocket.connected) {
                liveSocket.emit('iam_sender');
            }
        }

        function setButtonsEnabled(enabled) {
            const buttons = document.querySelectorAll('.event-grid button');
            buttons.forEach(btn => {
                btn.disabled = !enabled;
                btn.style.opacity = enabled ? '1' : '0.5';
            });
        }

        function createSocket() {
            socket = io({
                transports: ['websocket', 'polling'],
                reconnection: true,
                reconnectionAttempts: Infinity,
                reconnectionDelay: 500,
                reconnectionDelayMax: 5000,
                timeout: 20000
            });

            socket.on('connect', () => {
                const light = document.getElementById('statusLight');
                if(light) light.classList.remove('disconnected');
                emitSenderStatus(sendingEnabled);
            });

            socket.on('disconnect', (reason) => {
                const light = document.getElementById('statusLight');
                if(light) light.classList.add('disconnected');
            });

            socket.on('connect_error', (err) => {
                console.error(err);
            });
        }

        function createLiveSocket() {
            liveSocket = io(LIVE_API_URL, {
                transports: ['websocket', 'polling'],
                reconnection: true,
                reconnectionAttempts: Infinity,
                reconnectionDelay: 500,
                reconnectionDelayMax: 5000,
                timeout: 20000
            });

            liveSocket.on('connect', () => {
                if(sendingEnabled) {
                    liveSocket.emit('iam_sender');
                }
            });

            liveSocket.on('connect_error', (err) => {
                console.error('Live socket error:', err);
            });
        }

        function sendEvent(eventName) {
            if(!sendingEnabled) {
                return;
            }

            const localConnected = !!(socket && socket.connected);
            const liveConnected = !!(liveSocket && liveSocket.connected);

            if(!localConnected && !liveConnected) {
                alert('Server connect nahi hai. Thoda wait karo.');
                return;
            }

            const eventData = {
                type: 'EVENT',
                payload: { event: eventName }
            };

            if(localConnected) {
                socket.emit('broadcast', eventData);
            }

            if(liveConnected) {
                liveSocket.emit('event', eventData);
            }
        }
    </script>
</body>
</html>
