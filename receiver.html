<!DOCTYPE html>
<html>
<head>
    <title>🏏 Cricket DRS - Receiver</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: hidden;
            user-select: none;
        }

        .card {
            background: transparent;
            border-radius: 20px;
            padding: 18px;
            width: 90%;
            max-width: 500px;
            max-height: calc(100vh - 24px);
            overflow: hidden;
        }

        h1 {
            color: #1e3c72;
            text-align: center;
            margin-bottom: 12px;
            font-size: 22px;
        }

        .result-box {
            background: transparent;
            border-radius: 12px;
            min-height: 86px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #1e3c72;
        }

        .section {
            margin-bottom: 12px;
            padding: 12px;
            background: transparent;
            border-radius: 10px;
        }

        .section-title {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .id-box {
            background: white;
            border: 2px solid #1e3c72;
            border-radius: 8px;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #1e3c72;
            text-align: center;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .input-group { display: flex; gap: 10px; }

        input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus { outline: none; border-color: #1e3c72; }

        button {
            padding: 10px 14px;
            background: #1e3c72;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .sender-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            background: #e8f5e9;
            transition: opacity 0.3s ease, background 0.3s ease;
        }

        .sender-status.sender-offline {
            opacity: 0.4;
            background: #ffebee;
        }

        .sender-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f44336;
            box-shadow: 0 0 6px rgba(244, 67, 54, 0.8);
        }

        #wicket-flash {
            display: none;
            background: #ff4444;
            color: white;
            border-radius: 12px;
            padding: 26px 16px;
            text-align: center;
            font-size: 34px;
            font-weight: bold;
            margin-top: 14px;
        }

        @media (max-width: 480px) {
            h1 { font-size: 20px; }
            .result-box { font-size: 34px; }
            #wicket-flash { font-size: 30px; padding: 22px 14px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="section">
            <div class="result-box" id="result-box">&nbsp;</div>
        </div>

        <h1>🏏 Receiver</h1>

        <div class="sender-status sender-offline" id="senderStatus">
            <span class="sender-dot" id="senderDot"></span>
            <span id="senderText">Sender</span>
        </div>
    </div>

    <script>
        let socket;
        let clearResultTimer = null;
        const audioCache = {};

        const audioUrls = {
            'BALL': '/audio/ball.ogg',
            'WICKET': '/audio/wicket.ogg',
            'CAUGHT OUT': '/audio/wicket.ogg',
            'LBW OUT': '/audio/wicket.ogg',
            'BOWLED': '/audio/wicket.ogg',
            'RUN OUT': '/audio/wicket.ogg',
            'STUMPED OUT': '/audio/wicket.ogg',
            'HIT WICKET': '/audio/wicket.ogg',
            '0': '/audio/0.ogg',
            '1': '/audio/1.ogg',
            '2': '/audio/2.ogg',
            '3': '/audio/3.ogg',
            '4': '/audio/4.ogg',
            '6': '/audio/6.ogg',
            'WIDE': '/audio/wide.ogg',
            'WIDE+1': '/audio/wide.ogg',
            'WIDE+2': '/audio/wide.ogg',
            'WIDE+4': '/audio/wide.ogg',
            'HAWA MAI': '/audio/hawa-mai.ogg',
            'APPEAL': '/audio/appeal.ogg',
            'BALL STOP': '/audio/ball-stop.ogg',
            'NOT OUT': '/audio/not-out.ogg',
            'NO BALL': '/audio/no-ball.ogg',
            'NO BALL+1': '/audio/no-ball.ogg',
            'NO BALL+2': '/audio/no-ball.ogg',
            'NO BALL+4': '/audio/no-ball.ogg',
            'NO BALL+6': '/audio/no-ball.ogg'
        };

        window.onload = function() {
            preloadAudio();
            createSocket();
        };

        function preloadAudio() {
            const uniqueSrcs = [...new Set(Object.values(audioUrls))];
            uniqueSrcs.forEach((src) => {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.load();
                audioCache[src] = audio;
            });
        }

        function createSocket() {
            socket = io({
                transports: ['websocket', 'polling'],
                reconnection: true,
                reconnectionAttempts: Infinity,
                reconnectionDelay: 500,
                reconnectionDelayMax: 5000,
                timeout: 20000
            });

            socket.on('event', (data) => {
                handleEvent(data);
            });

            socket.on('sender_status', (data) => {
                updateSenderStatus(data);
            });
        }

        function handleEvent(data) {
            if(!data || typeof data !== 'object') return;
            const { type, payload } = data;

            if(type !== 'EVENT') return;

            const eventText = payload && payload.event ? String(payload.event) : 'EVENT';
            showResult(eventText);
            playAudio(eventText);
        }

        function playAudio(eventName) {
            const audioUrl = audioUrls[eventName];
            if(!audioUrl) return;

            try {
                const cached = audioCache[audioUrl];
                const clip = cached ? cached.cloneNode() : new Audio(audioUrl);
                clip.volume = 1.0;
                clip.play().catch(err => console.log('Audio play failed:', err));
            } catch(e) {
                console.log('Audio error:', e);
            }
        }

        function showResult(text) {
            const box = document.getElementById('result-box');
            if(!box) return;

            box.innerText = text;
            box.style.color = '#000000';
            box.style.textShadow = '0px 0px 6px grey';

            if(clearResultTimer) {
                clearTimeout(clearResultTimer);
                clearResultTimer = null;
            }
            clearResultTimer = setTimeout(() => {
                box.innerHTML = '&nbsp;';
                box.style.color = '#1e3c72';
                box.style.textShadow = 'none';
                clearResultTimer = null;
            }, 5000);
        }

        function updateSenderStatus(data) {
            const dot = document.getElementById('senderDot');
            const statusSection = document.getElementById('senderStatus');
            if(!dot || !statusSection) return;

            const enabled = !!(data && data.enabled);
            dot.style.background = enabled ? '#4caf50' : '#f44336';
            dot.style.boxShadow = enabled
                ? '0 0 6px rgba(76, 175, 80, 0.8)'
                : '0 0 6px rgba(244, 67, 54, 0.8)';

            if(enabled) {
                statusSection.classList.remove('sender-offline');
            } else {
                statusSection.classList.add('sender-offline');
            }
        }
    </script>
</body>
</html>
